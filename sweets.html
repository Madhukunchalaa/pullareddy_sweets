<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G Pulla Reddy Sweets - Products</title>
    <link rel="shortcut icon" href="assets/img/logo/favicon.webp">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Breadcrumb -->
  <div id="dynamic-banner" class="breadcrumb-wrapper bg-cover" style="background-image: url('assets/img/banners/sweets-banner.jpg');">
  <div class="container">
    <div class="page-heading left text-white">
      <h1 id="banner-title">Our Products</h1>
      <ul class="breadcrumb-items" style="font-weight:700; font-size:1.1rem;">
        <li><a href="index.html">Home</a></li>
        <li style="color: white;">&gt;</li>
        <li id="breadcrumb-category">Sweets</li>
      </ul>
    </div>
  </div>
</div>



    <!-- Products Section -->
    <section class="food-category-section fix section-padding section-bg">
        <div class="container">
            <div class="row g-5">
                <!-- Sidebar -->
                <div class="col-xl-3 col-lg-4 order-2 order-md-1 mt-5">
                    <div class="main-sidebar">
                        <!-- Categories -->
                        <div class="single-sidebar-widget">
                            <div class="wid-title">
                                <h4>Categories</h4>
                            </div>
                            <div class="widget-categories">
                                <ul class="categories-list">
                                    <li class="active">
                                        <a href="#" data-filter="sweets">Sweets</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="traditional_sweets">Traditional Sweets</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="kaju_sweets">Kaju Sweets</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="dry_fruit_sweets">Dry Fruit Sweets</a>
                                    </li>

                                    <li>
                                        <a href="#" data-filter="snacks">Savouries</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="bakery">Bakery</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="juicy_sweets">Juice / Bengali Sweets</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="ghee">Ghee Savouries</a>
                                    </li>
                                    <li>
                                        <a href="#" data-filter="pickle&powder">Pickles &amp; Powders</a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- New Arrivals - Dynamically populated -->
                        <div class="single-sidebar-widget">
                            <div class="wid-title">
                                <h4>New Arrivals</h4>
                            </div>
                            <div class="popular-food-posts" id="featured-products">
                                <!-- Will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="col-xl-9 col-lg-8 order-1 order-md-2">
                    <!-- Products Container - Dynamically populated -->
                    <div class="row" id="products-container">
                        <!-- Products will be loaded here by JavaScript -->
                    </div>

                    <!-- Pagination -->
                    <div class="page-nav-wrap mt-5 text-center">
                        <ul>
                            <li><a class="page-numbers" href="#" id="prevBtn"><i class="fal fa-long-arrow-left"></i></a></li>
                            <li><a class="page-numbers pagenumberactive" href="#" id="page1">1</a></li>
                            <li><a class="page-numbers" href="#" id="page2">2</a></li>
                            <li><a class="page-numbers" href="#" id="page3">3</a></li>
                            <li><a class="page-numbers" href="#" id="page4">4</a></li>
                            <li><a class="page-numbers" href="#" id="nextBtn"><i class="fal fa-long-arrow-right"></i></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/products.js"></script> <!-- Product data -->
    <script src="assets/js/products-handler.js"></script> <!-- Product handling logic -->
    
    <script>
        // Load header and footer
        fetch('header.html')
            .then(response => response.text())
            .then(data => document.getElementById('header-placeholder').innerHTML = data);

        fetch('footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data);
    </script>
  <script>
  const DEFAULT_CATEGORY = "sweets";

  // Get category from URL and normalise it
  const params = new URLSearchParams(window.location.search);
  const requestedCategory = (params.get("category") || DEFAULT_CATEGORY).toLowerCase();

  // Map any aliases from the nav to the underlying product category keys
  const categoryMap = {
    sweets: "sweets",
    savouries: "snacks",
    snacks: "snacks",
    pickles: "pickle&powder",
    "pickels": "pickle&powder",
    "pickelsandpowder": "pickle&powder",
    powders: "pickle&powder",
    "pickles & powders": "pickle&powder",
    "pickles and powders": "pickle&powder",
    bakery: "bakery",
    ghee: "ghee",
    "ghee savouries": "ghee",
    "traditional_sweets": "traditional_sweets",
    "traditional sweets": "traditional_sweets",
    "kaju_sweets": "kaju_sweets",
    "kaju sweets": "kaju_sweets",
    "dry_fruit_sweets": "dry_fruit_sweets",
    "dry fruit sweets": "dry_fruit_sweets",
    "juicy_sweets": "juicy_sweets",
    "juicy sweets": "juicy_sweets",
    "juice sweets": "juicy_sweets",
    "juice / bengali sweets": "juicy_sweets",
    "juice and bengali sweets": "juicy_sweets",
    "pickle&powder": "pickle&powder"
  };

  const canonicalCategory = categoryMap[requestedCategory] || requestedCategory || DEFAULT_CATEGORY;

  // DOM elements
  const banner = document.getElementById("dynamic-banner");
  const bannerTitle = document.getElementById("banner-title");
  const breadcrumbCategory = document.getElementById("breadcrumb-category");

  // Category-based banner data keyed by the canonical category values
  const bannerData = {
    sweets: {
      title: "Traditional Indian Sweets",
      image: "assets/img/sweets-banner-new.jpg",
      breadcrumb: "Sweets"
    },
    snacks: {
      title: "Crispy Savouries",
      image: "assets/img/savories.jpg",
      breadcrumb: "Savouries"
    },
    "pickle&powder": {
      title: "Authentic Pickles & Powders",
      image: "assets/img/pickle_banner.jpg",
      breadcrumb: "Pickles & Powders"
    },
    bakery: {
      title: "Freshly Baked Delights",
      image: "assets/img/our-products-banner.jpg",
      breadcrumb: "Bakery"
    },
    ghee: {
      title: "Rich Ghee Savouries",
      image: "assets/img/ghee-savouries-banner1.jpg",
      breadcrumb: "Ghee Savouries"
    },
    traditional_sweets: {
      title: "Classic Traditional Sweets",
      image: "assets/img/classic-traditional-sweets.jpg",
      breadcrumb: "Traditional Sweets"
    },
    kaju_sweets: {
      title: "Premium Kaju Sweets",
      image: "assets/img/kaju-barfi-banner.jpg",
      breadcrumb: "Kaju Sweets"
    },
    dry_fruit_sweets: {
      title: "Healthy Dry Fruit Sweets",
      image: "assets/img/sweetsbanner1.jpg",
      breadcrumb: "Dry Fruit Sweets"
    },
    juicy_sweets: {
      title: "Juicy & Bengali Sweets",
      image: "assets/img/GPR_Inner Banners2.png",
      breadcrumb: "Juice / Bengali Sweets"
    }
  };

  function applyBanner(categoryKey) {
    if (!banner || !bannerTitle || !breadcrumbCategory) {
      return;
    }
    const info = bannerData[categoryKey] || bannerData[DEFAULT_CATEGORY];
    if (!info) return;

    banner.style.backgroundImage = `url('${info.image}')`;
    bannerTitle.textContent = info.title;
    breadcrumbCategory.textContent = info.breadcrumb;
  }

  // Apply the banner for the initial category and expose helpers for other scripts
  applyBanner(canonicalCategory);
  window.initialCategory = canonicalCategory;
  window.applyBannerForCategory = applyBanner;
</script>


</body>
</html>
