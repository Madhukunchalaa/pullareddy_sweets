<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Header with Offcanvas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        
        
        
        
        .header-logo img {
            max-height: 50px;
            width: auto;
        }
        
       
        
        .navbar-nav .nav-link {
            color: #333;
            font-weight: 500;
            padding: 10px 20px;
            transition: color 0.3s ease;
            position: relative;
            font-family: Barlow Condensed;
        }
        
        .navbar-nav .nav-link:hover {
            color: #AE1F23;
        }
        
        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 20px;
            width: 0;
            height: 2px;
            background-color: #AE1F23;
            transition: width 0.3s ease;
        }
        
        .navbar-nav .nav-link:hover::after {
            width: calc(100% - 40px);
        }
        
        .theme-btn {
            display: inline-block;
            padding: 19px 30px;
            background-color: #dc3545;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 2px solid #dc3545;
        }
        
        .theme-btn:hover {
            background-color: #c82333;
            border-color: #c82333;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
        }
        
        .navbar-toggler {
            border: none;
            padding: 8px 12px;
            background-color: transparent;
        }
        
        .navbar-toggler:focus {
            box-shadow: none;
        }
        
        .navbar-toggler-icon {
            background-image: none;
            width: 28px;
            height: 3px;
            background-color: #333;
            position: relative;
            display: block;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .navbar-toggler-icon::before,
        .navbar-toggler-icon::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 3px;
            background-color: #333;
            left: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .navbar-toggler-icon::before {
            top: -9px;
        }
        
        .navbar-toggler-icon::after {
            top: 9px;
        }
        
        /* Offcanvas Styles */
        .offcanvas {
            width: 300px !important;
        }
        
        .offcanvas-header {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px;
        }
        
        .offcanvas-title img {
            max-height: 50px;
        }
        
        .btn-close {
            font-size: 14px;
        }
        
        .offcanvas-body {
            padding: 0;
        }
        
        .offcanvas .navbar-nav {
            width: 100%;
        }
        
        .offcanvas .nav-item {
            border-bottom: 1px solid #f0f0f0;
        }
        
        .offcanvas .nav-link {
            padding: 18px 25px;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .offcanvas .nav-link:hover {
            background-color: #f8f9fa;
            color: #dc3545;
            padding-left: 30px;
        }
        
        .offcanvas .nav-link::after {
            display: none;
        }
        
        .offcanvas .header-button {
            padding: 25px;
        }
        
        .offcanvas .theme-btn {
            display: block;
            width: 100%;
            text-align: center;
        }
        
        /* Desktop menu styles */
        @media (min-width: 992px) {
            .desktop-menu {
                display: flex !important;
            }
        }
        
        @media (max-width: 991px) {
            .desktop-menu {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Header Area Start -->
    <header class="section-bg">
        <div id="header-sticky">
            <div class="container">
                <nav class="navbar">
                    <a class="navbar-brand header-logo" href="index.html">
                        <img src="assets/img/logo/logo.png" alt="logo-img">
                    </a>
                    
                    <!-- Desktop Menu -->
                    <div class="desktop-menu ms-auto">
                        <ul class="navbar-nav align-items-center flex-row">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="about.html">About Us</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="sweets.html">Our Products</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="gallery.html">Gallery</a>
                            </li>
                        </ul>
                    </div>
                    <div class="desktop-menu ms-auto">
                        <ul class="navbar-nav align-items-center flex-row">
                            
                           
                            <li class="nav-item ms-3">
                                <a href="contact.html" class="theme-btn">Contact Us</a>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- Mobile Menu Toggle -->
                    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </nav>
            </div>
        </div>
    </header>
    <!-- Header Area End -->

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">
                <img src="assets/img/logo/logo.png" alt="logo-img">
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="sweets.html">Our Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a>
                </li>
            </ul>
            <div class="header-button">
                <a href="contact.html" class="theme-btn">Contact Us</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
