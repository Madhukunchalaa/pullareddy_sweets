<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Header with Offcanvas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .phoenix-brand-wrapper img {
            max-height: 50px;
            width: auto;
        }
        
        .horizon-navigation .zenith-nav-list .nebula-link {
            color: #333;
            font-weight: 500;
            padding: 10px 20px;
            transition: color 0.3s ease;
            position: relative;
            font-size: 18px;
        }
        
        .zenith-nav-list .nebula-link:hover {
            color: #AE1F23;
        }
        
        .zenith-nav-list .nebula-link::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 20px;
            width: 0;
            height: 2px;
            background-color: #AE1F23;
            transition: width 0.3s ease;
        }
        
        .zenith-nav-list .nebula-link:hover::after {
            width: calc(100% - 40px);
        }
        
        .crimson-action-btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #AC1E23;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 2px solid #AC1E23;
            font-family: Barlow Condensed;
            color: white;
        }
        
        .crimson-action-btn:hover {
            background-color: #c82333;
            border-color: #c82333;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
        }
        
        .aurora-toggle-btn {
            border: none;
            padding: 8px 12px;
            background-color: transparent;
        }
        
        .aurora-toggle-btn:focus {
            box-shadow: none;
        }
        
        .aurora-toggle-icon {
            background-image: none;
            width: 28px;
            height: 3px;
            background-color: #333;
            position: relative;
            display: block;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .aurora-toggle-icon::before,
        .aurora-toggle-icon::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 3px;
            background-color: #333;
            left: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .aurora-toggle-icon::before {
            top: -9px;
        }
        
        .aurora-toggle-icon::after {
            top: 9px;
        }
        
        /* Social Media Icons */
        .social-icon {
            gap: 15px;
            margin: 0 20px;
        }
        
        .social-icon a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background-color: #f8f9fa;
            color: #333;
            border-radius: 50%;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .social-icon a:hover {
            background-color: #AC1E23;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(172, 30, 35, 0.3);
        }
        
        .social-icon a i {
            font-size: 16px;
        }
        
        /* Offcanvas Styles */
        .mercury-sidebar-panel {
            width: 300px !important;
        }
        
        .mercury-sidebar-header {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px;
        }
        
        .mercury-sidebar-title img {
            max-height: 50px;
        }
        
        .btn-close {
            font-size: 14px;
        }
        
        .mercury-sidebar-content {
            padding: 0;
        }
        
        .mercury-sidebar-panel .zenith-nav-list {
            width: 100%;
        }
        
        .mercury-sidebar-panel .galaxy-nav-item {
            border-bottom: 1px solid #f0f0f0;
        }
        
        .mercury-sidebar-panel .nebula-link {
            padding: 18px 25px;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .mercury-sidebar-panel .nebula-link:hover {
            background-color: #f8f9fa;
            color: #AC1E23;
            padding-left: 30px;
        }
        
        .mercury-sidebar-panel .nebula-link::after {
            display: none;
        }
        
        .mercury-sidebar-panel .social-icon {
            padding: 25px;
            justify-content: center;
            border-bottom: 1px solid #f0f0f0;
            margin: 0;
        }
        
        .mercury-sidebar-panel .apex-button-zone {
            padding: 25px;
        }
        
        .mercury-sidebar-panel .crimson-action-btn {
            display: block;
            width: 100%;
            text-align: center;
        }
        
        /* Desktop menu styles */
        @media (min-width: 992px) {
            .quantum-display-menu {
                display: flex !important;
            }
        }
        
        @media (max-width: 991px) {
            .quantum-display-menu {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Header Area Start -->
    <header class="section-bg">
        <div id="stellar-header-fixed">
            <div class="container">
                <nav class="horizon-navigation navbar">
                    <a class="navbar-brand phoenix-brand-wrapper" href="index.html">
                        <img src="assets/img/logo/logo.png" alt="logo-img">
                    </a>
                    
                    <!-- Desktop Menu -->
                    <div class="quantum-display-menu ms-auto">
                        <ul class="zenith-nav-list navbar-nav align-items-center flex-row">
                            <li class="galaxy-nav-item nav-item">
                                <a class="nebula-link nav-link" href="index.html">Home</a>
                            </li>
                            <li class="galaxy-nav-item nav-item">
                                <a class="nebula-link nav-link" href="about.html">About Us</a>
                            </li>
                            <li class="galaxy-nav-item nav-item">
                                <a class="nebula-link nav-link" href="sweets.html">Our Products</a>
                            </li>
                            <li class="galaxy-nav-item nav-item">
                                <a class="nebula-link nav-link" href="gallery.html">Gallery</a>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- Social Media Icons -->
                    <div class="quantum-display-menu">
                         <div class="social-icon d-flex align-items-center">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                
                <a href="#"><i class="fab fa-instagram"></i></a>
               
            </div>
                    </div>
                      
                    <div class="quantum-display-menu">
                        <ul class="zenith-nav-list navbar-nav align-items-center flex-row">
                            <li class="galaxy-nav-item nav-item">
                                <a href="contact.html" class="crimson-action-btn">Contact Us</a>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- Mobile Menu Toggle -->
                    <button class="aurora-toggle-btn navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mercurySidebarPanel" aria-controls="mercurySidebarPanel" aria-label="Toggle navigation">
                        <span class="aurora-toggle-icon navbar-toggler-icon"></span>
                    </button>
                </nav>
            </div>
        </div>
    </header>
    <!-- Header Area End -->

    <!-- Offcanvas Menu -->
    <div class="mercury-sidebar-panel offcanvas offcanvas-end" tabindex="-1" id="mercurySidebarPanel" aria-labelledby="mercurySidebarLabel">
        <div class="mercury-sidebar-header offcanvas-header">
            <h5 class="mercury-sidebar-title offcanvas-title" id="mercurySidebarLabel">
                <img src="assets/img/logo/logo.png" alt="logo-img">
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="mercury-sidebar-content offcanvas-body">
            <ul class="zenith-nav-list navbar-nav">
                <li class="galaxy-nav-item nav-item">
                    <a class="nebula-link nav-link" href="index.html">Home</a>
                </li>
                <li class="galaxy-nav-item nav-item">
                    <a class="nebula-link nav-link" href="about.html">About Us</a>
                </li>
                <li class="galaxy-nav-item nav-item">
                    <a class="nebula-link nav-link" href="sweets.html">Our Products</a>
                </li>
                <li class="galaxy-nav-item nav-item">
                    <a class="nebula-link nav-link" href="gallery.html">Gallery</a>
                </li>
            </ul>
            
            <!-- Social Media Icons in Mobile Menu -->
            <div class="social-icon d-flex align-items-center">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                
                <a href="#"><i class="fab fa-instagram"></i></a>
               
            </div>
            
            <div class="apex-button-zone">
                <a href="contact.html" class="crimson-action-btn">Contact Us</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
