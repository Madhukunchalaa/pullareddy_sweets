<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel with Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item">
      <img src="assets/img/sweetsbanner1.jpg" class="d-block w-100" alt="Slide 1">
    </div>
    
   
    
    <div class="carousel-item active">
      <video class="d-block w-100" muted loop playsinline preload="auto">
        <source src="assets/img/bannervideo2.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const carousel = document.querySelector('#myCarousel');
    
    if (carousel) {
      carousel.addEventListener('slid.bs.carousel', function() {
        const allVideos = carousel.querySelectorAll('video');
        allVideos.forEach(video => {
          video.pause();
          video.currentTime = 0;
        });
        
        const activeVideo = carousel.querySelector('.carousel-item.active video');
        if (activeVideo) {
          activeVideo.play().catch(error => {
            console.log('Video autoplay prevented:', error);
          });
        }
      });
    }
  });
</script>

</body>
</html>
