<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Menu Example</title>

    <!-- Font Awesome for hamburger icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Your CSS -->
    <style>
        /* Header base styling */
        .header-1 {
            background: #fff;
            padding: 15px 0;
            position: relative;
            z-index: 1000;
        }
        .header-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-logo img {
            max-height: 50px;
        }

        /* MeanMenu nav styling */
        .mean-nav {
            display: none;
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            background: #fff;
            z-index: 9999;
            padding: 10px 0;
        }
        .mean-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .mean-nav ul li {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .mean-nav ul li a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }
        .mean-nav ul li:last-child {
            border-bottom: none;
        }

        /* Hide reveal button entirely */
        .meanmenu-reveal {
            display: none !important;
        }

        /* Mobile hamburger */
        #mobile-menu-toggle {
            font-size: 24px;
            cursor: pointer;
            color: #e00000;
        }

        @media (min-width: 992px) {
            .mean-nav {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<!-- ================= Header Area Start ================= -->
<header class="section-bg">
    <div id="header-sticky" class="header-1">
        <div class="container">
            <div class="mega-menu-wrapper">
                <div class="header-main">
                    <div class="logo">
                        <a href="index.html" class="header-logo">
                            <img src="assets/img/logo/logo.png" alt="logo-img">
                        </a>
                    </div>
                    
                    <div class="header-left">
                        <div class="mean__menu-wrapper d-none d-lg-block">
                            <div class="main-menu">
                                <nav id="mobile-menu">
                                    <ul>
                                        <li class="active"><a href="index.html">Home</a></li>
                                        <li><a href="about.html">About Us</a></li>
                                        <li><a href="sweets.html">Our Products</a></li>
                                        <li><a href="gallery.html">Gallery</a></li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                    
                    <div class="header-right d-flex justify-content-end align-items-center">
                        <div class="header-button">
                            <a href="contact.html" class="theme-btn bg-red-2">Contact Us</a>
                        </div>

                        <!-- Mobile Menu Toggle Button -->
                        <div class="header__hamburger d-lg-none my-auto">
                            <div class="sidebar__toggle" id="mobile-menu-toggle">
                                <i class="fas fa-bars"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- ================= Header Area End ================= -->


<!-- ✅ Scripts Section -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="assets/js/jquery.meanmenu.min.js"></script>

<script>
jQuery(document).ready(function ($) {
    // Initialize MeanMenu but hide its default reveal button
    $('#mobile-menu').meanmenu({
        meanMenuContainer: '.header-left',
        meanScreenWidth: "991",
        meanRevealPosition: "none", // Hide the reveal button
        meanShowChildren: true
    });

    // Hide the meanmenu reveal button if it appears
    $('.meanmenu-reveal').hide();

    // Control the menu manually using your hamburger button
    $('#mobile-menu-toggle').on('click', function () {
        $('.mean-nav').slideToggle(); // toggle visibility of mobile nav
    });
});
</script>

</body>
</html>
