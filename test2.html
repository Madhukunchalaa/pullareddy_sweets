<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item {
            height: 650px;
            margin: 0;
            padding: 0;
        }

        .carousel-fade .carousel-item {
            opacity: 0;
            transition-duration: 0.1s;
            transition-property: opacity;
        }

        .carousel-fade .carousel-item.active {
            opacity: 1;
        }

        .banner-container,
        .banner-container1,
        .banner-container2 {
            height: 100%;
            width: 100%;
            min-height: 600px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 100px;
            margin: 0;
        }

        /* Desktop Background images */
        .banner-container {
            background-image: url("../img/home-banner2.jpg");
        }
        .banner-container1 {
            background-image: url("../img/new-home-banner5.jpg");
        }
        .banner-container2 {
            background-image: url("../img/sweets-banner2.jpg");
        }

        /* Headings */
        .banner-container h2,
        .banner-container1 h2,
        .banner-container2 h2 {
            color: #E5C592;
            font-size: 72px;
            text-align: left;
            font-weight: bolder;
            line-height: 1.2;
            margin-bottom: 20px;
            text-transform: capitalize;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Subheadings */
        .banner-container h5,
        .banner-container1 h5,
        .banner-container2 h5 {
            color: #fff;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* CTA Button */
        .heritage-cta-button {
            color: #AC1E23;
            background-color: #E5C592;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .heritage-cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Indicators */
        .carousel-indicators {
            bottom: 20px;
        }

        .carousel-indicators [data-bs-target] {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #E5C592;
            opacity: 0.6;
            border: none;
            transition: opacity 0.3s ease;
        }

        .carousel-indicators .active {
            opacity: 1;
        }

        /* Controls */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: brightness(0) invert(1);
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .banner-container h2,
            .banner-container1 h2,
            .banner-container2 h2 {
                font-size: 56px;
            }
        }

        @media (max-width: 768px) {
            .carousel-item {
                height: 500px;
            }

            .banner-container,
            .banner-container1,
            .banner-container2 {
                padding-left: 50px;
                padding-right: 20px;
                min-height: 500px;
            }

            .banner-container h2,
            .banner-container1 h2,
            .banner-container2 h2 {
                font-size: 42px;
            }

            .banner-container h5,
            .banner-container1 h5,
            .banner-container2 h5 {
                font-size: 18px;
                letter-spacing: 3px;
            }

            .heritage-cta-button {
                font-size: 16px;
                padding: 14px 35px;
            }

            /* Mobile Background images - add your mobile versions here */
            .banner-container {
                background-image: url("../img/home-banner2-mobile.jpg");
            }
            .banner-container1 {
                background-image: url("../img/new-home-banner5-mobile.jpg");
            }
            .banner-container2 {
                background-image: url("../img/sweets-banner2-mobile.jpg");
            }
        }

        @media (max-width: 480px) {
            .carousel-item {
                height: 450px;
            }

            .banner-container,
            .banner-container1,
            .banner-container2 {
                padding-left: 25px;
                padding-right: 15px;
                min-height: 450px;
            }

            .banner-container h2,
            .banner-container1 h2,
            .banner-container2 h2 {
                font-size: 32px;
            }

            .banner-container h5,
            .banner-container1 h5,
            .banner-container2 h5 {
                font-size: 14px;
                letter-spacing: 2px;
                margin-bottom: 30px;
            }

            .heritage-cta-button {
                font-size: 14px;
                padding: 12px 28px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

<div id="carouselExampleAutoplaying" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000" data-bs-wrap="true">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <!-- Carousel Slides -->
    <div class="carousel-inner">

        <!-- Slide 1 -->
        <div class="carousel-item active">
            <div class="banner-container1">
                <h2>77 Years Of <br> Sweet Heritage</h2>
                <h5>Handcrafted with Love Since 1948</h5>
                <a href="about.html">
                    <button class="heritage-cta-button mb-5">Know More</button>
                </a>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-item">
            <div class="banner-container2">
                <h2>Timeless Flavors<br> Eternal Memories</h2>
                <h5>Where tradition meets indulgence</h5>
                <a href="about.html">
                    <button class="heritage-cta-button mb-5">Know More</button>
                </a>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-item">
            <div class="banner-container">
                <h2>Creating Sweet<br> Memories</h2>
                <h5>Trusted by families for 3 generations</h5>
                <a href="about.html">
                    <button class="heritage-cta-button mb-5">Know More</button>
                </a>
            </div>
        </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
